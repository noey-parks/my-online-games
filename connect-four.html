<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connect Four | My Online Games</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: linear-gradient(135deg, #14213d, #000000);
        color: #ffffff;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 1.5rem;
      }

      main {
        max-width: 42rem;
        text-align: center;
        width: 100%;
      }

      h1 {
        font-size: clamp(2.25rem, 8vw, 4rem);
        margin: 0;
      }

      .subtitle {
        color: #d8e2f2;
        margin: 0.5rem 0 1.25rem;
      }

      #status {
        font-size: 1.2rem;
        font-weight: bold;
        margin: 0 0 1rem;
        min-height: 1.5em;
      }

      .board {
        background: #1460c4;
        border: 0.55rem solid #0d3e81;
        border-radius: 1rem;
        display: grid;
        gap: clamp(0.25rem, 1vw, 0.55rem);
        grid-template-columns: repeat(7, 1fr);
        padding: clamp(0.25rem, 1vw, 0.55rem);
      }

      .cell {
        aspect-ratio: 1;
        background: #f5f5f5;
        border: 0;
        border-radius: 50%;
        box-shadow: inset 0.2rem 0.2rem 0.35rem #b9b9b9;
        cursor: pointer;
        padding: 0;
        transition: transform 120ms ease;
      }

      .cell:hover:not(:disabled),
      .cell:focus-visible:not(:disabled) {
        outline: 0.2rem solid #fca311;
        outline-offset: 0.1rem;
        transform: translateY(-0.15rem);
      }

      .cell:disabled {
        cursor: default;
      }

      .red {
        background: #e63946;
        box-shadow: inset 0.2rem 0.2rem 0.35rem #a51e2a;
      }

      .green {
        background: #43aa5b;
        box-shadow: inset 0.2rem 0.2rem 0.35rem #277137;
      }

      .winning {
        box-shadow: inset 0.2rem 0.2rem 0.35rem rgb(0 0 0 / 35%), 0 0 0 0.25rem #ffffff;
        position: relative;
        z-index: 1;
      }

      #confetti {
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        position: fixed;
        z-index: 2;
      }

      .confetti-piece {
        animation: shower 2.8s cubic-bezier(.15, .75, .4, 1) var(--delay) forwards;
        background: var(--color);
        height: 0.75rem;
        left: var(--left);
        position: absolute;
        top: -1rem;
        transform: rotate(var(--rotation));
        width: 0.45rem;
      }

      @keyframes shower {
        to {
          opacity: 0;
          transform: translate(var(--drift), 110vh) rotate(calc(var(--rotation) + 720deg));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .confetti-piece {
          animation: none;
          display: none;
        }
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: center;
        margin-top: 1.25rem;
      }

      a,
      button {
        border: 0;
        border-radius: 0.65rem;
        cursor: pointer;
        font: inherit;
        font-weight: bold;
        padding: 0.8rem 1.1rem;
      }

      #restart,
      #robot {
        background: #fca311;
        color: #14213d;
      }

      #restart:hover,
      #restart:focus-visible,
      #robot:hover,
      #robot:focus-visible {
        background: #ffffff;
      }

      a {
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="confetti" aria-hidden="true"></div>
    <main>
      <h1>Connect Four</h1>
      <p class="subtitle">Drop your pieces and connect four in a row to win.</p>
      <p id="status" aria-live="polite">Red player's turn</p>
      <div class="board" id="board" aria-label="Connect Four game board"></div>
      <div class="controls">
        <button id="restart" type="button">New game</button>
        <button id="robot" type="button">Play a robot</button>
        <a href="index.html">All games</a>
      </div>
    </main>

    <script>
      const rows = 6;
      const columns = 7;
      const board = Array.from({ length: rows }, () => Array(columns).fill(null));
      const boardElement = document.querySelector("#board");
      const statusElement = document.querySelector("#status");
      const restartButton = document.querySelector("#restart");
      const robotButton = document.querySelector("#robot");
      const confettiElement = document.querySelector("#confetti");
      let currentPlayer;
      let gameOver;
      let robotOpponent = false;

      function playerName(player) {
        return player === "red" ? "Red" : "Green";
      }

      function updateTurnStatus() {
        statusElement.textContent = robotOpponent && currentPlayer === "green"
          ? "Robot's turn"
          : `${playerName(currentPlayer)} player's turn`;
      }

      function createBoard() {
        boardElement.innerHTML = "";

        for (let row = 0; row < rows; row += 1) {
          for (let column = 0; column < columns; column += 1) {
            const cell = document.createElement("button");
            cell.className = "cell";
            cell.type = "button";
            cell.dataset.row = row;
            cell.dataset.column = column;
            cell.setAttribute("aria-label", `Column ${column + 1}, row ${row + 1}`);
            cell.addEventListener("click", () => playColumn(column));
            boardElement.append(cell);
          }
        }
      }

      function getCell(row, column) {
        return boardElement.querySelector(`[data-row="${row}"][data-column="${column}"]`);
      }

      function getAvailableColumns() {
        return [3, 2, 4, 1, 5, 0, 6].filter((column) => board[0][column] === null);
      }

      function getOpenRow(column) {
        return board.findLastIndex((boardRow) => boardRow[column] === null);
      }

      function winningCells(row, column, player = currentPlayer) {
        const directions = [
          [0, 1],
          [1, 0],
          [1, 1],
          [1, -1],
        ];

        return directions.reduce((winner, [rowStep, columnStep]) => {
          if (winner) {
            return winner;
          }

          const before = [];
          const after = [];

          for (const direction of [-1, 1]) {
            let nextRow = row + rowStep * direction;
            let nextColumn = column + columnStep * direction;

            while (
              nextRow >= 0 &&
              nextRow < rows &&
              nextColumn >= 0 &&
              nextColumn < columns &&
              board[nextRow][nextColumn] === player
            ) {
              if (direction === -1) {
                before.push([nextRow, nextColumn]);
              } else {
                after.push([nextRow, nextColumn]);
              }
              nextRow += rowStep * direction;
              nextColumn += columnStep * direction;
            }
          }

          const connectedCells = [...before.reverse(), [row, column], ...after];
          if (connectedCells.length < 4) {
            return null;
          }

          const start = Math.max(0, before.length - 3);
          return connectedCells.slice(start, start + 4);
        }, null);
      }

      function scoreWindow(window) {
        const green = window.filter((piece) => piece === "green").length;
        const red = window.filter((piece) => piece === "red").length;
        const empty = 4 - green - red;

        if (green === 4) {
          return 100000;
        }

        if (red === 4) {
          return -100000;
        }

        if (green === 3 && empty === 1) {
          return 120;
        }

        if (red === 3 && empty === 1) {
          return -150;
        }

        if (green === 2 && empty === 2) {
          return 12;
        }

        if (red === 2 && empty === 2) {
          return -14;
        }

        return 0;
      }

      function evaluateBoard() {
        let score = board.reduce(
          (total, row) => total + (row[3] === "green" ? 6 : row[3] === "red" ? -6 : 0),
          0,
        );

        const directions = [
          [0, 1],
          [1, 0],
          [1, 1],
          [1, -1],
        ];

        for (let row = 0; row < rows; row += 1) {
          for (let column = 0; column < columns; column += 1) {
            directions.forEach(([rowStep, columnStep]) => {
              const endRow = row + rowStep * 3;
              const endColumn = column + columnStep * 3;

              if (endRow >= rows || endColumn < 0 || endColumn >= columns) {
                return;
              }

              const window = Array.from(
                { length: 4 },
                (_, index) => board[row + rowStep * index][column + columnStep * index],
              );
              score += scoreWindow(window);
            });
          }
        }

        return score;
      }

      function minimax(depth, maximizing, alpha, beta) {
        const columnsToCheck = getAvailableColumns();
        if (depth === 0 || columnsToCheck.length === 0) {
          return evaluateBoard();
        }

        const player = maximizing ? "green" : "red";
        let bestScore = maximizing ? -Infinity : Infinity;

        for (const column of columnsToCheck) {
          const row = getOpenRow(column);
          board[row][column] = player;
          const isWin = winningCells(row, column, player);
          const score = isWin
            ? (player === "green" ? 100000 + depth : -100000 - depth)
            : minimax(depth - 1, !maximizing, alpha, beta);
          board[row][column] = null;

          if (maximizing) {
            bestScore = Math.max(bestScore, score);
            alpha = Math.max(alpha, bestScore);
          } else {
            bestScore = Math.min(bestScore, score);
            beta = Math.min(beta, bestScore);
          }

          if (beta <= alpha) {
            break;
          }
        }

        return bestScore;
      }

      function chooseRobotColumn() {
        let bestColumn;
        let bestScore = -Infinity;

        for (const column of getAvailableColumns()) {
          const row = getOpenRow(column);
          board[row][column] = "green";
          const isWin = winningCells(row, column, "green");
          const score = isWin ? Infinity : minimax(4, false, -Infinity, Infinity);
          board[row][column] = null;

          if (score > bestScore) {
            bestScore = score;
            bestColumn = column;
          }
        }

        return bestColumn;
      }

      function showConfetti() {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          return;
        }

        const colors = ["#e63946", "#43aa5b", "#42c6f5", "#8ad051", "#c77dff"];
        confettiElement.innerHTML = "";

        for (let index = 0; index < 80; index += 1) {
          const piece = document.createElement("span");
          piece.className = "confetti-piece";
          piece.style.setProperty("--color", colors[index % colors.length]);
          piece.style.setProperty("--delay", `${Math.random() * 0.65}s`);
          piece.style.setProperty("--drift", `${-14 + Math.random() * 28}vw`);
          piece.style.setProperty("--left", `${Math.random() * 100}vw`);
          piece.style.setProperty("--rotation", `${Math.random() * 360}deg`);
          confettiElement.append(piece);
        }

        window.setTimeout(() => {
          confettiElement.innerHTML = "";
        }, 3600);
      }

      function playColumn(column, isRobotMove = false) {
        if (gameOver || (robotOpponent && currentPlayer === "green" && !isRobotMove)) {
          return;
        }

        const row = getOpenRow(column);
        if (row === -1) {
          statusElement.textContent = `Column ${column + 1} is full. Choose another column.`;
          return;
        }

        board[row][column] = currentPlayer;
        const cell = getCell(row, column);
        cell.classList.add(currentPlayer);
        cell.setAttribute("aria-label", `${playerName(currentPlayer)} piece in column ${column + 1}, row ${row + 1}`);

        const winner = winningCells(row, column);
        if (winner) {
          gameOver = true;
          statusElement.textContent = `${playerName(currentPlayer)} player wins!`;
          winner.forEach(([winningRow, winningColumn]) => {
            getCell(winningRow, winningColumn).classList.add("winning");
          });
          showConfetti();
          boardElement.querySelectorAll(".cell").forEach((boardCell) => {
            boardCell.disabled = true;
          });
          return;
        }

        if (board.every((boardRow) => boardRow.every((piece) => piece !== null))) {
          gameOver = true;
          statusElement.textContent = "It's a draw!";
          return;
        }

        currentPlayer = currentPlayer === "red" ? "green" : "red";
        updateTurnStatus();

        if (robotOpponent && currentPlayer === "green") {
          window.setTimeout(playRobotTurn, 500);
        }
      }

      function playRobotTurn() {
        if (!robotOpponent || gameOver || currentPlayer !== "green") {
          return;
        }

        playColumn(chooseRobotColumn(), true);
      }

      function startGame() {
        board.forEach((row) => row.fill(null));
        currentPlayer = "red";
        gameOver = false;
        updateTurnStatus();
        confettiElement.innerHTML = "";
        createBoard();
      }

      restartButton.addEventListener("click", startGame);
      robotButton.addEventListener("click", () => {
        robotOpponent = !robotOpponent;
        robotButton.textContent = robotOpponent ? "Play a friend" : "Play a robot";
        startGame();
      });
      startGame();
    </script>
  </body>
</html>
