<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" role="img" aria-labelledby="title">
  <title>Caesar cipher wheel</title>
  <rect width="420" height="270" rx="16" fill="#5d4b72"/>
  <circle cx="210" cy="135" r="105" fill="#d6c38b" stroke="#2a2234" stroke-width="7"/>
  <circle cx="210" cy="135" r="70" fill="#6c5a7e" stroke="#2a2234" stroke-width="6"/>
  <circle cx="210" cy="135" r="18" fill="#d6c38b" stroke="#2a2234" stroke-width="5"/>
  <g font-family="monospace" font-size="18" font-weight="bold" fill="#30253a">
    <text x="201" y="47">A</text><text x="274" y="76">D</text><text x="292" y="143">G</text><text x="264" y="207">J</text><text x="201" y="235">M</text><text x="132" y="207">P</text><text x="111" y="143">S</text><text x="136" y="76">V</text>
  </g>
  <g font-family="monospace" font-size="17" font-weight="bold" fill="#f9edc2">
    <text x="201" y="91">X</text><text x="246" y="112">A</text><text x="250" y="159">D</text><text x="201" y="184">G</text><text x="157" y="159">J</text><text x="160" y="112">M</text>
  </g>
  <text x="210" y="260" text-anchor="middle" font-family="serif" font-size="16" fill="#fff3cb">turn three letters back</text>
</svg>
